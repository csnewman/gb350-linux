[build]
target = "mipsel-unknown-none"

[unstable]
build-std = ["core"]

[target.mipsel-unknown-none]
# The second core is a 24KE that reports MIPS32 Release 1 (Config.AR = 0):
# R2 instructions such as seb/seh/ext/ins raise Reserved Instruction.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "relocation-model=static", "-C", "target-cpu=mips32", "-C", "target-feature=-mips32r2"]
